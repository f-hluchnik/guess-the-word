version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new Python version needs wheels for gensim, numpy and scipy first,
      # and CI doesn't build the image. Upgrade by hand when they're out.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
