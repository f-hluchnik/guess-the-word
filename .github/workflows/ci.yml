name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" re-runs the checks when schedule-reset is added.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the word list check compares against main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Word list keeps started batches unchanged
        # Add the "schedule-reset" label to a pull request to skip this on
        # purpose, e.g. to replace the list before launch.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'schedule-reset') }}
        run: |
          git show origin/main:data/words.toml > /tmp/words-main.toml 2>/dev/null || true
          if [ -s /tmp/words-main.toml ]; then
            python -m scripts.words check --against /tmp/words-main.toml
          else
            python -m scripts.words check
          fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds on Fly's remote builder, which caches the vectors layer.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
