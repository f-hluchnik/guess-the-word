# Fly.io configuration. See README.md, "Deploying to Fly.io".
# App names are global on Fly: change this if "kosinus" is taken.
app = "kosinus"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  [build.args]
    FREQUENT_WORDS = "300000"

[env]
  # Fly's proxy sets this header and overwrites any value a client sends.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Run one machine and suspend it when nobody plays. A suspended machine
  # resumes from a memory snapshot in a few hundred ms, vectors already loaded,
  # and costs only its root filesystem storage while idle.
  # One machine is not set here: run `fly scale count 1` once.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 250

  [[http_service.checks]]
    # Startup loads ~420 MB of vectors on a throttled shared CPU.
    grace_period = "60s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # About 180 MB for the process; the rest is page cache for the vectors.
  memory = "512mb"
